name: Secret Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  gitleaks:
    name: Scan repository for secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run gitleaks
        uses: zricethezav/gitleaks-action@v8
        with:
          args: '--verbose --redact --exit-code 1'

  # Extra simple pattern scan (fast grep) to catch accidental secrets
  grep-scan:
    name: Quick grep scan for common secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep for likely secrets
        run: |
          set -eo pipefail
          # search for common private-key headers and long base64 strings
          if grep -R --line-number -E "(PRIVATE KEY|BEGIN RSA PRIVATE KEY|BEGIN DSA PRIVATE KEY|AWS_SECRET_ACCESS_KEY|AKIA[0-9A-Z]{16})" .; then
            echo "Potential secret found" >&2
            exit 1
          fi

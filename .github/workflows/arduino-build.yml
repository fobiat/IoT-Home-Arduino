name: Arduino Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          export PATH="$HOME/bin:$PATH"

      - name: Install libraries and compile sketch
        run: |
          export PATH="$HOME/bin:$PATH"
          arduino-cli core update-index
          arduino-cli core install arduino:renesas_uno
          arduino-cli lib update-index
          # Install required libraries for reproducible builds
          arduino-cli lib install PubSubClient
          arduino-cli lib install "Adafruit BMP280 Library"
          arduino-cli lib install "Adafruit Unified Sensor"
          arduino-cli lib install "DHT sensor library"
          arduino-cli lib install MPU6050
          arduino-cli lib install "LiquidCrystal I2C"
          arduino-cli compile --fqbn arduino:renesas_uno:unor4wifi IoT_Home_Assistant

name: Arduino Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          export PATH="$HOME/bin:$PATH"

      - name: Install libraries and compile sketch
        run: |
          export PATH="$HOME/bin:$PATH"
          arduino-cli core update-index
          arduino-cli core install arduino:renesas_uno
          arduino-cli lib update-index
          # Install required libraries for reproducible builds
          # Pin library versions for reproducible builds
          arduino-cli lib install PubSubClient@2.8.0
          arduino-cli lib install "Adafruit BMP280 Library@2.6.8"
          arduino-cli lib install "Adafruit Unified Sensor@1.1.15"
          arduino-cli lib install "DHT sensor library@1.4.6"
          arduino-cli lib install MPU6050@1.4.4
          arduino-cli lib install "LiquidCrystal I2C@1.1.2"
          # If CI secrets are provided, create a local secrets.h for the build
          if [ -n "${{ secrets.WIFI_SSID }}" ] || [ -n "${{ secrets.MQTT_PASSWORD }}" ]; then
            mkdir -p IoT_Home_Assistant
            cat > IoT_Home_Assistant/secrets.h <<'EOF'
#ifndef IOT_HOME_SECRETS_H
#define IOT_HOME_SECRETS_H
#define WIFI_SSID "${{ secrets.WIFI_SSID }}"
#define WIFI_PASSWORD "${{ secrets.WIFI_PASSWORD }}"
#define MQTT_SERVER "${{ secrets.MQTT_SERVER }}"
#define MQTT_PORT ${{ secrets.MQTT_PORT }}
#define MQTT_USER "${{ secrets.MQTT_USER }}"
#define MQTT_PASSWORD "${{ secrets.MQTT_PASSWORD }}"
#endif
EOF
          fi

          arduino-cli compile --fqbn arduino:renesas_uno:unor4wifi IoT_Home_Assistant

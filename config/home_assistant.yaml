# Home Assistant Configuration for Arduino IoT

## MQTT Setup in Home Assistant

Add to your `configuration.yaml`:

```yaml
mqtt:
  broker: YOUR_BROKER_IP
  port: 1883
  username: homeassistant
  password: YOUR_MQTT_PASSWORD
  
automation: !include automations.yaml
script: !include scripts.yaml
```

---

## Sensor Configuration

Add these to `configuration.yaml` or create `sensors.yaml` and include it:

```yaml
mqtt:
  # ... mqtt config above ...

sensor:
  # Temperature
  - platform: mqtt
    name: "Arduino Temperature"
    state_topic: "home/arduino/sensor/temperature"
    unit_of_measurement: "°C"
    icon: mdi:thermometer
    
  # Humidity
  - platform: mqtt
    name: "Arduino Humidity"
    state_topic: "home/arduino/sensor/humidity"
    unit_of_measurement: "%"
    icon: mdi:water-percent
    
  # Pressure
  - platform: mqtt
    name: "Arduino Pressure"
    state_topic: "home/arduino/sensor/pressure"
    unit_of_measurement: "hPa"
    icon: mdi:gauge
    
  # Altitude
  - platform: mqtt
    name: "Arduino Altitude"
    state_topic: "home/arduino/sensor/altitude"
    unit_of_measurement: "m"
    icon: mdi:altimeter
    
  # Distance
  - platform: mqtt
    name: "Arduino Distance"
    state_topic: "home/arduino/sensor/distance"
    unit_of_measurement: "cm"
    icon: mdi:ruler
    
  # Soil Moisture
  - platform: mqtt
    name: "Arduino Soil Moisture"
    state_topic: "home/arduino/sensor/soil_moisture"
    unit_of_measurement: ""
    icon: mdi:water-check
    
  # Sound Level
  - platform: mqtt
    name: "Arduino Sound Level"
    state_topic: "home/arduino/sensor/sound_level"
    unit_of_measurement: ""
    icon: mdi:volume-high
    
  # Rain Detection
  - platform: mqtt
    name: "Arduino Rain Status"
    state_topic: "home/arduino/sensor/rain"
    icon: mdi:water-drop
```


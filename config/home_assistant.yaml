## Initial Setup Steps

1. **Configure WiFi credentials** in the Arduino sketch:
   ```cpp
   const char* ssid = "YOUR_SSID";
   const char* password = "YOUR_PASSWORD";
   const char* mqtt_server = "192.168.1.X";  // Your Home Assistant IP
   ```

2. **Setup MQTT in Home Assistant**:
   - Install MQTT broker add-on or use external broker
   - Create MQTT user and password
   - Note the broker IP address

3. **Upload to Arduino**:
   - Connect Arduino R4 via USB-C
   - Select board: Arduino Uno R4 WiFi
   - Select correct COM port
   - Click Upload

4. **Monitor in Home Assistant**:
   - Check Developer Tools → MQTT
   - Subscribe to `home/arduino/#` to see all messages
   - Verify sensor entities appear automatically

5. **Test Controls**:
   - Use Developer Tools → Services
   - Call `mqtt.publish` to test relay control
   - Example: `home/arduino/control/relay1` → `ON`

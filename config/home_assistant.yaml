## Switch Configuration

For relay control:

```yaml
switch:
  - platform: mqtt
    name: "Arduino Relay 1"
    command_topic: "home/arduino/control/relay1"
    state_topic: "home/arduino/relay1/state"
    payload_on: "ON"
    payload_off: "OFF"
    icon: mdi:power-switch-open
    
  - platform: mqtt
    name: "Arduino Relay 2"
    command_topic: "home/arduino/control/relay2"
    state_topic: "home/arduino/relay2/state"
    payload_on: "ON"
    payload_off: "OFF"
    icon: mdi:power-switch-open
    
  - platform: mqtt
    name: "Arduino Buzzer"
    command_topic: "home/arduino/control/buzzer"
    state_topic: "home/arduino/buzzer/state"
    payload_on: "ON"
    payload_off: "OFF"
    icon: mdi:speaker-wireless
```


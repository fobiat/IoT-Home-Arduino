# Home Assistant Configuration for Arduino IoT

## MQTT Setup in Home Assistant

Add to your `configuration.yaml`:

```yaml
mqtt:
  broker: YOUR_BROKER_IP
  port: 1883
  username: homeassistant
  password: YOUR_MQTT_PASSWORD

automation: !include automations.yaml
script: !include scripts.yaml
  - platform: mqtt
# Home Assistant sample configuration (documentation)

This file contains documentation and example snippets for integrating the
Arduino-based sensors with Home Assistant. It is intentionally written as
comments so it is safe to store in the repository and won't be parsed as
runtime configuration by tools that validate YAML.

# Example MQTT configuration (place in your real `configuration.yaml`):
#
# mqtt:
#   broker: 192.168.1.2
#   port: 1883
#   username: homeassistant
#   password: YOUR_MQTT_PASSWORD
#
# Example sensor (MQTT) snippet:
#
# sensor:
#   - platform: mqtt
#     name: "Arduino Temperature"
#     state_topic: "home/arduino/sensor/temperature"
#     unit_of_measurement: "°C"

# Automation examples and dashboard snippets are intentionally omitted
# from this file to avoid accidental validation errors. See the docs
# in `docs/QUICK_START.md` for full examples and copy the small
# snippets into your Home Assistant `configuration.yaml` as needed.
  - platform: mqtt

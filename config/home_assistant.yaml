## Automation Examples

```yaml
automation:
  # Alert when temperature too high
  - alias: "High Temperature Alert"
    trigger:
      platform: numeric_state
      entity_id: sensor.arduino_temperature
      above: 28
    action:
      service: notify.mobile_app
      data:
        message: "Temperature is {{ states('sensor.arduino_temperature') }}°C"
        title: "High Temperature Warning"

  # Alert when rain detected
  - alias: "Rain Detected"
    trigger:
      platform: mqtt
      topic: "home/arduino/sensor/rain"
      payload: "wet"
    action:
      - service: switch.turn_on
        entity_id: switch.arduino_relay_1  # Trigger rain alert
      - delay: 00:00:05
      - service: switch.turn_off
        entity_id: switch.arduino_relay_1

  # Low soil moisture alert
  - alias: "Low Soil Moisture"
    trigger:
      platform: numeric_state
      entity_id: sensor.arduino_soil_moisture
      below: 200
    action:
      service: persistent_notification.create
      data:
        title: "Water Plant"
        message: "Soil moisture is low: {{ states('sensor.arduino_soil_moisture') }}"
        notification_id: "water_plant"

  # High noise alert
  - alias: "High Noise Level"
    trigger:
      platform: numeric_state
      entity_id: sensor.arduino_sound_level
      above: 600
    action:
      service: switch.turn_on
      entity_id: switch.arduino_buzzer
```


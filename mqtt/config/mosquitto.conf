# Mosquitto configuration for local testing
# WARNING: This example enables anonymous access for convenience. Do NOT
# use this configuration on an exposed network. For production, set
# `allow_anonymous false` and configure `password_file` with secure creds.

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log

# Listen on default MQTT port
listener 1883

# Disable anonymous access and require authentication using a password file.
# The file `mqtt/config/passwordfile` is generated from `IoT_Home_Assistant/secrets.h`.
allow_anonymous false
password_file /mosquitto/config/passwordfile

# To enable websockets, uncomment and configure the following block:
# listener 9001
# protocol websockets

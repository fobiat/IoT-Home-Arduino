repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: https://github.com/pre-commit/mirrors-detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.46.0
    hooks: []

# Notes:
# - Install pre-commit locally: `pip install pre-commit`
# - Then enable for this checkout: `pre-commit install` (or run `pre-commit run --all-files` to scan once)
[platformio]
; PlatformIO project configuration for Arduino R4 WiFi
; Update the `board` value in the environment below to the exact PlatformIO board ID
; for your Arduino R4 WiFi (if you know it). Example board name placeholder used here.

[env:arduino_r4_wifi]
platform = arduino
board = <UPDATE_BOARD_ID_HERE>
framework = arduino

build_flags =
  ; Add any required build flags or library options here

lib_deps =
  WiFiS3
  knolleary/PubSubClient@^2.8
  adafruit/Adafruit BMP280 Library@^2.0.2
  adafruit/Adafruit Unified Sensor@^1.1.4
  adafruit/DHT sensor library@^1.4.3
  jrowberg/i2cdevlib@^1.0.4
  LiquidCrystal I2C@^1.1.2

; Note: Replace the `board` above with the correct PlatformIO board id for Arduino R4 WiFi.
; If you prefer, you can run `pio boards | grep -i r4` locally to find the right id.
